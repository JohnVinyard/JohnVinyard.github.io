<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stacked DHO Synth</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c10;
      --panel: #12141a;
      --accent: #7fd3ff;
      --text: #e8ecf1;
      --muted: #8b93a3;
    }
    * {
      box-sizing: border-box;
      /* Kill the mobile tap-highlight flash and iOS's long-press
         copy/select callout everywhere -- user-select:none alone (already
         set on .plane) isn't enough to fully suppress either of these on
         touch devices, and both are especially disruptive on elements meant
         for sustained press-and-hold gestures like the control strips. */
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-transform: uppercase;
      margin: 0 0 4px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 560px;
      margin: 12px 0 4px;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel);
      border: 1px solid #232838;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--text);
      border-color: var(--accent);
    }
    .tab-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tab-content[hidden] {
      display: none;
    }
    .scope-wrap {
      position: relative;
      width: 100%;
      max-width: 560px;
    }
    canvas#scope {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      background: var(--panel);
      display: block;
    }
    #scopeModeBtn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 10px;
      font-size: 0.72rem;
      background: rgba(18, 20, 26, 0.75);
    }
    .plane {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin-top: 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, #182234, #101520);
      border: 1px solid #232838;
      color: var(--muted);
      font-size: 0.8rem;
      user-select: none;
      touch-action: none;
      cursor: pointer;
      outline: none;
      transition: background 0.08s ease, border-color 0.08s ease;
      overflow: hidden;
    }
    .plane.active {
      border-color: var(--accent);
    }
    .plane .node-marker {
      position: absolute;
      top: calc(50% + 8px);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      opacity: 0.3;
      transform: translate(-50%, -50%);
      transition: opacity 0.05s linear, transform 0.05s linear;
      pointer-events: none;
    }
    .plane { height: 100px; }
    .plane.energy .node-marker { background: var(--accent); }
    .plane.damp .node-marker { background: #ff8a5c; }

    /* dual-zone planes (the two damping strips): damping on top, tension-mod
       ("deformation" -- press to raise tension/pitch) along the bottom */
    .plane.dual { height: 190px; }
    .plane.dual .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px dashed #232838;
      pointer-events: none;
    }
    .plane.dual .node-marker.top { top: 28px; }
    .plane.dual .node-marker.bottom {
      top: calc(100% - 28px);
      background: #b892ff;
    }
    .controls {
      width: 100%;
      max-width: 560px;
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
    }
    .controls .row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .controls .row.full {
      grid-column: 1 / -1;
    }
    .controls label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] { width: 100%; }
    select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #232838;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.85rem;
    }
    select option:disabled { color: var(--muted); }
    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    button {
      background: var(--panel);
      border: 1px solid #232838;
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }

    .params-panel {
      width: 100%;
      max-width: 900px;
      margin-top: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .params-panel .full-width {
      grid-column: 1 / -1;
      overflow-x: auto;
    }
    .params-panel h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin: 0 0 8px;
      font-weight: 600;
    }
    .params-panel table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }
    .params-panel th, .params-panel td {
      padding: 4px 6px;
      text-align: right;
      border-bottom: 1px solid #1c2030;
    }
    .params-panel th:first-child, .params-panel td:first-child { text-align: left; }
    .params-panel table.matrix td {
      text-align: center;
      border: 1px solid #1c2030;
      color: #e8ecf1;
    }
  </style>
</head>
<body>
  <h1>Stacked DHO Synth</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="play">Play</button>
    <button class="tab-btn" data-tab="params">Parameters</button>
  </div>

  <div id="tab-play" class="tab-content">

  <div class="scope-wrap">
    <canvas id="scope" width="1000" height="280"></canvas>
    <button id="scopeModeBtn">Spectrogram</button>
  </div>

  <div id="layer2DampPlane" class="plane damp dual">
    <div class="divider"></div>
  </div>

  <div id="layer1DampPlane" class="plane damp dual">
    <div class="divider"></div>
  </div>

  <div id="energyPlane" class="plane energy"></div>

  <div class="controls">
    <div class="row full">
      <label>Randomization strategy</label>
      <select id="strategySelect">
        <option value="random">Fully random</option>
        <option value="physical">Physically plausible</option>
      </select>
    </div>
    <div class="row">
      <label>Energy injection</label>
      <select id="excitationModeSelect">
        <option value="sustained">Sustained (hold)</option>
        <option value="impulse">Strike (pluck)</option>
        <option value="pulse">Bow (pulse train)</option>
        <option value="noise">Wind (noise)</option>
      </select>
    </div>
    <div class="row">
      <label>Pulse rate (bow mode) <span id="pulseRateLabel">100 Hz</span></label>
      <input id="pulseRateSlider" type="range" min="20" max="400" step="1" value="100" />
    </div>
    <div class="row">
      <label>Layer 1 nodes <span id="n1Label">8</span></label>
      <input id="n1Slider" type="range" min="1" max="16" step="1" value="8" />
    </div>
    <div class="row">
      <label>Layer 2 nodes <span id="n2Label">8</span></label>
      <input id="n2Slider" type="range" min="1" max="16" step="1" value="8" />
    </div>
    <div class="row">
      <label>Volume</label>
      <input id="volumeSlider" type="range" min="0" max="10" step="0.05" value="0.6" />
    </div>
    <div class="row">
      <label>Routing sparsity <span id="sparsityLabel">0.50</span></label>
      <input id="sparsitySlider" type="range" min="0" max="0.95" step="0.01" value="0.5" />
    </div>
    <div class="row">
      <label>Mod depth <span id="modDepthLabel">1.00</span></label>
      <input id="modDepthSlider" type="range" min="0.1" max="10" step="0.05" value="1" />
    </div>
    <div class="row">
      <label>Reverb mix</label>
      <input id="reverbMixSlider" type="range" min="0" max="1" step="0.01" value="0" />
    </div>
  </div>

  <div class="buttons">
    <button id="startBtn">Start audio</button>
    <button id="randomizeBtn">Randomize</button>
    <button id="shareBtn">Share</button>
  </div>

  </div>

  <div id="tab-params" class="tab-content" hidden>

  <div class="params-panel">
    <div id="layer1Table" class="full-width"></div>
    <div id="layer2Table" class="full-width"></div>
    <div id="tensionRouterGrid"></div>
    <div id="forceRouterGrid"></div>
    <div id="reverbInfo" class="full-width"></div>
  </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
